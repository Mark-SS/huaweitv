plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quiztv.guard'
    compileSdk 36

    defaultConfig {
        applicationId 'com.quiztv.guard'
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
